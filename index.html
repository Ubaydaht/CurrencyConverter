<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <style>
   section{
      width: 100%;
      height: 100vh; 
      flex-direction: column;
      background-color:rgba(243, 225, 202, 0.856);
   }
   .box{
      /* background-color:rgba(243, 225, 202, 0.856); */
      box-shadow: 0 0 8px rgba(245, 188, 114, 0.555) ;
      border-radius: 15px;
      padding: 15px;
      margin-top: 30px;
      width: 30%;
   }
   input{
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 10px ;
      margin-bottom: 20px;
   }
   select{
      width: 45%;
      border: none;
      border-radius: 5px;
     padding: 5px;
   }
   .btn1{
      width: 70%;
      border: none;
      margin: 20px 10px 10px auto;
      background-color: burlywood;
      padding: 12px;
      border-radius: 5px;
   }
   .btn2{
      width: 25%;
      border: none;
      background-color: rgba(230, 168, 87, 0.205);
      padding: 12px;
      border-radius: 5px;
   }
   #result{
      width: 100%;
      height: 10vh;
      background-color: rgba(222, 184, 135, 0.13);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      font-size: 20px;
   }
@media (max-width:1024px) {
   .box{
      width: 90%;
   }
}

  </style>
<body>
   <section class="d-flex justify-content-center align-items-center">
       <h2 class="fw-medium">Currency Converter</h2>
       <span>for Naira, Dollar and Euro</span>
     <div class="box">
      <span class="d-block">Amount:</span>
      <input type="number" placeholder="Enter the amount" id="amount">
      <span style="padding-right:45% ;">From:</span>
      <span>To:</span> 
     <div class="conv d-flex justify-content-between">
      <select name="" id="firstCurrency">
        <option value="USD">US Dollars</option>
        <option value="Naira">Nigeria Naira</option>
        <option value="EURO">European EURO</option>
     </select>
     <img src="simple-icons--convertio.svg" alt="">
     <select name="" id="secondCurrency">
        <option value="Naira">Nigeria Naira</option>
       <option value="USD" >US Dollars</option>
        <option value="EURO">European EURO</option>
     </select>
     </div>
     <button onclick="convert()"class="btn1 fw-bold" >convert</button>
     <button onclick="clearFields()" class="btn2 fw-bold">clear</button>
      <div id="result"></div>
      <div class="pt-2">
         <span>Note:</span>
         <p>1. You can click the currency option to change to another currency</p>
         <p>2. This only works for fixed exchange rate not real time.</p>
         <p>$1 - ₦1,468 👉   £1 - ₦1,660  👈  $1 - £0.86</p>
         

      </div>
     </div>

   </section>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>


<script src="script.js"></script>
</html>
